<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水面波纹效果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #0a0a0a;
            font-family: 'Segoe UI', sans-serif;
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        .controls {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px 20px;
            color: #fff;
            font-size: 13px;
            line-height: 1.6;
            user-select: none;
            transition: opacity 0.3s;
        }

        .controls h3 {
            font-size: 14px;
            margin-bottom: 8px;
            color: #4fc3f7;
            letter-spacing: 1px;
        }

        .controls p {
            color: rgba(255, 255, 255, 0.6);
        }

        .controls .hint {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
        }

        .toggle-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px 16px;
            color: #4fc3f7;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .toggle-btn:hover {
            background: rgba(79, 195, 247, 0.2);
            border-color: rgba(79, 195, 247, 0.4);
        }
    </style>
    <base target="_blank">
</head>

<body>
    <div class="controls" id="controls">
        <h3>🌊 水面波纹模拟</h3>
        <p>移动鼠标或触摸屏幕产生波纹</p>
        <p>点击产生更大涟漪</p>
        <div class="hint">按 R 键切换雨滴模式</div>
    </div>
    <button class="toggle-btn" id="rainBtn" onclick="toggleRain()">🌧️ 开启雨滴</button>
    <canvas id="water"></canvas>

    <script>
        const canvas = document.getElementById('water');
        const ctx = canvas.getContext('2d');

        let width, height;
        let buffer1, buffer2, tempBuffer;
        let damping = 0.96;
        let lightRefraction = 256;
        let isRaining = false;
        let rainInterval;
        let mouseX = 0, mouseY = 0;
        let isMouseDown = false;

        // 背景图像数据（模拟水底）
        let bgImageData;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;

            const size = width * height;
            buffer1 = new Int16Array(size);
            buffer2 = new Int16Array(size);

            createBackground();
        }

        function createBackground() {
            bgImageData = ctx.createImageData(width, height);
            const data = bgImageData.data;

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const i = (y * width + x) * 4;

                    // 创建深海渐变背景
                    const depth = y / height;
                    const wave = Math.sin(x * 0.01 + y * 0.005) * 0.5 + 0.5;

                    // 基础深海蓝
                    let r = Math.floor(10 + wave * 15 - depth * 20);
                    let g = Math.floor(30 + wave * 25 - depth * 15);
                    let b = Math.floor(60 + wave * 40 + depth * 30);

                    // 添加一些"水草"或"沙地"纹理
                    const noise = Math.sin(x * 0.03) * Math.cos(y * 0.03) * Math.sin(x * 0.07 + y * 0.04);
                    if (noise > 0.7) {
                        r += 10; g += 25; b += 5;
                    }

                    // 添加光斑效果
                    const lightSpot = Math.sin(x * 0.02) * Math.sin(y * 0.015);
                    if (lightSpot > 0.8) {
                        r += 30; g += 40; b += 50;
                    }

                    data[i] = Math.min(255, Math.max(0, r));
                    data[i + 1] = Math.min(255, Math.max(0, g));
                    data[i + 2] = Math.min(255, Math.max(0, b));
                    data[i + 3] = 255;
                }
            }
        }

        function processRipples() {
            const w = width;
            const h = height;

            for (let y = 1; y < h - 1; y++) {
                const rowOffset = y * w;
                for (let x = 1; x < w - 1; x++) {
                    const idx = rowOffset + x;

                    // 波纹传播算法（平均邻居值）
                    let val = (
                        buffer1[idx - 1] +
                        buffer1[idx + 1] +
                        buffer1[idx - w] +
                        buffer1[idx + w]
                    ) >> 1;

                    val -= buffer2[idx];
                    val -= val >> 5; // 阻尼

                    buffer2[idx] = val;
                }
            }

            // 交换缓冲区
            tempBuffer = buffer1;
            buffer1 = buffer2;
            buffer2 = tempBuffer;
        }

        function render() {
            const imageData = ctx.createImageData(width, height);
            const data = imageData.data;
            const bgData = bgImageData.data;
            const w = width;
            const h = height;

            for (let y = 0; y < h; y++) {
                const rowOffset = y * w;
                for (let x = 0; x < w; x++) {
                    const idx = rowOffset + x;
                    const pixelIdx = idx * 4;

                    let xOffset = 0;
                    let yOffset = 0;

                    if (x > 0 && x < w - 1 && y > 0 && y < h - 1) {
                        xOffset = buffer1[idx - 1] - buffer1[idx + 1];
                        yOffset = buffer1[idx - w] - buffer1[idx + w];
                    }

                    // 根据波纹偏移采样背景
                    let sampleX = x + (xOffset >> 3);
                    let sampleY = y + (yOffset >> 3);

                    sampleX = Math.max(0, Math.min(w - 1, sampleX));
                    sampleY = Math.max(0, Math.min(h - 1, sampleY));

                    const sampleIdx = (sampleY * w + sampleX) * 4;

                    // 高光效果
                    const shading = xOffset;

                    let r = bgData[sampleIdx] + shading;
                    let g = bgData[sampleIdx + 1] + shading;
                    let b = bgData[sampleIdx + 2] + shading;

                    // 添加水面反光
                    const reflection = Math.abs(xOffset) + Math.abs(yOffset);
                    const highlight = reflection > 200 ? (reflection - 200) >> 2 : 0;

                    r += highlight;
                    g += highlight;
                    b += highlight + (highlight >> 1);

                    data[pixelIdx] = Math.min(255, Math.max(0, r));
                    data[pixelIdx + 1] = Math.min(255, Math.max(0, g));
                    data[pixelIdx + 2] = Math.min(255, Math.max(0, b));
                    data[pixelIdx + 3] = 255;
                }
            }

            ctx.putImageData(imageData, 0, 0);
        }

        function disturb(x, y, strength) {
            if (x < 2 || x >= width - 2 || y < 2 || y >= height - 2) return;

            const radius = 3;
            for (let dy = -radius; dy <= radius; dy++) {
                for (let dx = -radius; dx <= radius; dx++) {
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist <= radius) {
                        const idx = (y + dy) * width + (x + dx);
                        if (idx >= 0 && idx < buffer1.length) {
                            buffer1[idx] += strength * (1 - dist / radius);
                        }
                    }
                }
            }
        }

        function addRainDrop() {
            const x = Math.floor(Math.random() * (width - 20)) + 10;
            const y = Math.floor(Math.random() * (height - 20)) + 10;
            disturb(x, y, Math.random() * 300 + 200);
        }

        function toggleRain() {
            isRaining = !isRaining;
            const btn = document.getElementById('rainBtn');

            if (isRaining) {
                btn.textContent = '☀️ 关闭雨滴';
                btn.style.color = '#ffd54f';
                rainInterval = setInterval(() => {
                    for (let i = 0; i < 3; i++) {
                        addRainDrop();
                    }
                }, 100);
            } else {
                btn.textContent = '🌧️ 开启雨滴';
                btn.style.color = '#4fc3f7';
                clearInterval(rainInterval);
            }
        }

        // 鼠标事件
        canvas.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            disturb(mouseX, mouseY, isMouseDown ? 800 : 300);
        });

        canvas.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            disturb(e.clientX, e.clientY, 1500);
        });

        canvas.addEventListener('mouseup', () => {
            isMouseDown = false;
        });

        canvas.addEventListener('mouseleave', () => {
            isMouseDown = false;
        });

        // 触摸事件
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            disturb(touch.clientX, touch.clientY, 400);
        }, { passive: false });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            disturb(touch.clientX, touch.clientY, 1200);
        }, { passive: false });

        // 键盘事件
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                toggleRain();
            }
        });

        // 窗口调整
        window.addEventListener('resize', resize);

        // 动画循环
        function animate() {
            processRipples();
            render();
            requestAnimationFrame(animate);
        }

        // 初始化
        resize();
        animate();

        // 初始波纹
        setTimeout(() => {
            disturb(width >> 1, height >> 1, 2000);
        }, 500);
    </script>
</body>

</html>
