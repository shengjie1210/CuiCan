<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    video {
        object-fit: cover;
        width: 100vw;
        height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
    }

    body {
        height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        text-align: center;
    }

    h1 {
        position: relative;
        color: white;
    }

    .headline {
        width: 100%;
        font: 8vw system-ui, sans-serif;
        font-weight: 900;
        height: 150px;
    }

    @supports (backdrop-filter: blur(12px)) {
        .visually-hidden {
            position: absolute;
            top: -9999px;
            left: -9999px;
        }

        h1 {
            backdrop-filter: blur(12px);
            background: rgba(white, 0.2);
            clip-path: url(#lockup-headline-mask-path);
        }
    }
</style>

<body>
    <video src="https://css-tricks-post-videos.s3.us-east-1.amazonaws.com/Universe%20-%2013100.mp4" controls muted
        autoplay loop></video>
    <h1 class="headline">
        <span class="visually-hidden">cuican</span>
        <svg aria-hidden="true" id="lockup-headline-mask" class="headline lockup-headline-mask visually-hidden">
            <clipPath id="lockup-headline-mask-path">
                <text dominant-baseline="hanging" text-anchor="middle" x="50%" y="0em" dy="0.125em">cuican</text>
            </clipPath>
        </svg>
    </h1>
</body>

</html>
